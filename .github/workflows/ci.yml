name: RTL Verification

on:
  push:
  pull_request:

jobs:
  verilator-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Verilator
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator

      - name: Run ALU testbench
        run: make sim_verilator
