name: RTL CI
on: 
  push: 
  pull_request:

jobs:
  verilator_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ ccache make perl zlib1g

      - name: cac_Verilator
        id: cache_verilator
        uses: actions/cache@v4
        with:
          path: ~/verilator-install
          key: verilator-5.050-${{runner.os}}

      - name: Install Verilator 
        if: steps.cache_verilator.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y git help2man python3 autoconf flex bison libgoogle-perftools-dev numactl perl-doc libfl2 libfl-dev zlib1g-dev

      - name: Build
        if: steps.cache_verilator.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/verilator/verilator
          cd verilator
          git checkout v5.050
          autoconf
          ./configure --prefix=$HOME/verilator-install
          make -j$(nproc)
          make install

      - name: Verilator_PATH
        run: echo "$HOME/verilator-install/bin" >> $GITHUB_PATH

      - name: Run tb
        run: |
          verilator --version
          make sim_verilator
