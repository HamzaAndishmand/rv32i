name: RTL Verification

on:
  push:
  pull_request:

jobs:
  verilator-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Verilator
        uses: veryl-lang/setup-verilator@v1
        with:
          version: 5.050

      - name: Run ALU testbench
        run: make sim_verilator
