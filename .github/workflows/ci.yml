name: RTL CI

on:
  push:
  pull_request:

jobs:
  verilator_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Verilator
        uses: veryl-lang/setup-verilator@v1
        with:
          version: 5.050

      - name: Run testbench
        run: |
          verilator --version
          make sim_verilator 
